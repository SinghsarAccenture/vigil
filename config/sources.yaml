# Source registry. Synced into the `sources` table on every run.
# expected_every_hours drives stale_sources(): 26 = daily cron plus 2h slack.
# Placeholders (enabled: false) have no scraper yet; base_url is the regulator home page
# and scraper_type is a provisional guess to be confirmed when each scraper is built.

sources:
  - source_id: sec_rulemaking
    name: SEC Rulemaking Activity
    regulator: SEC
    jurisdiction: US
    scraper_type: html
    base_url: https://www.sec.gov/rules-regulations/rulemaking-activity
    expected_every_hours: 26
    enabled: true

